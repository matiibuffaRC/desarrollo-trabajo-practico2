<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5fa" />
    <meta name="description" content="Gestor de gastos personal: registrá ingresos y gastos, controlá tu presupuesto y mirá tus estadísticas." />
    <title>Gestor de gastos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
    <script>
      // Aplica el tema antes de pintar para evitar el parpadeo blanco
      try {
        var t = JSON.parse(localStorage.getItem("theme") || '"system"');
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        if (JSON.parse(localStorage.getItem("privacy") || "false") === true) document.documentElement.classList.add("privacy");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
